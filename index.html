@media(max-width:370px){.person-node:nth-of-type(1){left:17%}.person-node:nth-of-type(2){left:83%}}
.goal-tab span{overflow-wrap:anywhere}
/* Keep the primary action above—not on—the explanatory footer rule. */
.option-focus{min-height:0;flex:1}
.scene-footer{flex-shrink:0;margin-top:18px}
/* Slightly stronger ink for small labels on the ivory page. */
.benefit .label,.page-footer,.cover-footer span:not(.cover-count),.metric-copy span{color:#586e5f}

/* WealthWise curved folio v4. Pure visual/navigation enhancement. */
.book{perspective:none}
.book:not(.turning) #spread > .page{cursor:pointer}
.reading .book #spread .page{cursor:auto}
.book.turning{cursor:progress}
.book.turning #spread{pointer-events:none}
.book.turning > .sweep-shadow{display:none;animation:none}
.ww-turn-frame{position:absolute;inset:0;z-index:12;pointer-events:none;isolation:isolate}
.ww-turn-space{position:absolute;inset:0;perspective:2800px;transform-style:preserve-3d;pointer-events:none}
.ww-paper-strip{position:absolute;top:0;transform-origin:0 50%;transform-style:preserve-3d;will-change:transform;pointer-events:none}
.ww-paper-face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(.15px);background:var(--paper);pointer-events:none}
.ww-paper-face.ww-paper-back{transform:rotateY(180deg) translateZ(.15px)}
.ww-paper-viewport{position:absolute;top:0;height:100%;overflow:hidden;pointer-events:none}
.ww-paper-viewport > .page{width:100%;height:100%;min-height:0!important;border-radius:0!important;pointer-events:none!important}
.ww-paper-viewport > .spread{height:100%;pointer-events:none!important}
.ww-paper-viewport *{pointer-events:none!important;animation:none!important;transition:none!important;scroll-behavior:auto!important;caret-color:transparent!important}
.ww-paper-face:after{content:'';position:absolute;inset:0;box-shadow:inset 0 1px #ffffff21,inset 0 -1px #00000024;pointer-events:none}
.ww-paper-shade,.ww-paper-glint{position:absolute;inset:0;pointer-events:none;opacity:0;will-change:opacity}
.ww-paper-shade{background:#080b0b}
.ww-paper-glint{background:#fff6dd}
.ww-paper-back-blank{position:absolute;inset:0;background:linear-gradient(90deg,#d8cfbc,#efe7d7 23%,#f5efe3 80%,#c6baa5);overflow:hidden}
.ww-paper-back-blank:after{content:'WEALTHWISE';position:absolute;top:46%;left:12%;right:12%;text-align:center;font:12px Georgia,serif;letter-spacing:.35em;color:#a99b7b;opacity:.28}
.ww-paper-shadow{position:absolute;top:0;height:100%;width:48%;pointer-events:none;will-change:transform,opacity;opacity:0;transform-origin:0 50%;background:linear-gradient(90deg,#02070675,#02070638 25%,#02070610 62%,transparent)}
.ww-paper-contact{position:absolute;top:0;height:100%;width:6%;pointer-events:none;will-change:transform,opacity;opacity:0;transform-origin:0 50%;background:linear-gradient(90deg,transparent,#0507065c 45%,transparent)}
.page-corner{width:33px;height:33px;background:linear-gradient(135deg,transparent 47%,#6f725246 49%,#d4c7a6 58%,#f9f0da 89%,#9d947b);clip-path:polygon(0 100%,100% 0,100% 100%);opacity:.66;transition:width .25s ease,height .25s ease,opacity .25s ease;filter:drop-shadow(-2px -2px 3px #0003)}
@media(hover:hover){.book:not(.turning) .page:hover .page-corner{width:42px;height:42px;opacity:.9}.book:not(.turning):has(button:hover,input:hover,select:hover,a:hover) .page-corner{width:33px;height:33px;opacity:.66}}
.turn-hint .desktop-hint{display:block;margin-top:2px}
.ww-turn-instructions{font-size:9px;line-height:1.6;letter-spacing:.02em;color:#bfc6b4;display:flex;align-items:center;gap:9px;margin:0 0 10px}
.ww-turn-instructions .ww-turn-glyph{font-size:18px;line-height:1;color:var(--gold)}
.ww-turn-instructions .ww-turn-extra{color:#8e9b8a}
.reading .ww-turn-instructions{display:none}
@media(max-width:680px){.ww-turn-frame{overflow:hidden}.ww-turn-space{perspective:2000px}.ww-turn-instructions{font-size:9px}.ww-turn-instructions .ww-turn-extra{display:none}.turn-hint .desktop-hint{display:none}}
@media(prefers-reduced-motion:reduce){.ww-turn-frame{display:none!important}.page-corner{transition:none!important}}

 * WealthWise CurvedFolio v4 — dependency-free, real HTML on a curved sheet.
 * Transform/opacity keyframes are calculated before playback. No per-frame
 * layout reads, no rasterizing customer content, no network, no libraries.
 * Copyright 2026. Prepared for WealthWise; source is editable.

(() => {
  'use strict';
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const motion=matchMedia('(prefers-reduced-motion:reduce)');
  const active=new Set();
  let lastRun=null;

  function make(tag,cls){const e=document.createElement(tag);e.className=cls;return e;}
  function cleanClone(node){
    const copy=node.cloneNode(true);
    for(const el of [copy,...copy.querySelectorAll('*')]){
      el.removeAttribute('id');el.removeAttribute('autofocus');
      el.removeAttribute('aria-labelledby');el.removeAttribute('aria-describedby');
      if(el.matches('input,select,textarea,button,a,[tabindex]'))el.tabIndex=-1;
      if(el.matches('input,select,textarea'))el.removeAttribute('name');
    }
    return copy;
  }
  function retainScroll(source,copy){
    // CloneNode does not preserve scrolling or all live input properties.
    const aa=[source,...source.querySelectorAll('*')],bb=[copy,...copy.querySelectorAll('*')];
    for(let i=0;i<aa.length;i++){
      if(!bb[i])continue;
      if(aa[i].scrollTop)bb[i].scrollTop=aa[i].scrollTop;
      if(aa[i].scrollLeft)bb[i].scrollLeft=aa[i].scrollLeft;
      if(aa[i] instanceof HTMLInputElement){bb[i].value=aa[i].value;bb[i].checked=aa[i].checked;}
      if(aa[i] instanceof HTMLTextAreaElement)bb[i].value=aa[i].value;
      if(aa[i] instanceof HTMLSelectElement)bb[i].selectedIndex=aa[i].selectedIndex;
    }
  }
  function geometry(p,width,count,forward,single){
    // An inextensible strip curve. Root and tip rotate at different angles,
    // unlike a single stiff rectangle. Ends return exactly to a flat sheet.
    const sign=forward?1:-1,step=width/count;
    const bend=1.18*Math.sin(Math.PI*p);
    const root=Math.PI*p-bend*.46;
    let x=0,z=0;
    const result=[];
    for(let i=0;i<count;i++){
      const u=(i+.5)/count;
      const angle=root+bend*Math.pow(u,1.12);
      // The soft axial bow adds a little lift toward the outer edge.
      const lift=-7*Math.sin(Math.PI*p)*Math.pow(i/count,1.7);
      result.push({x:sign*x,z,angle:sign*(-angle),y:lift});
      x+=Math.cos(angle)*step;z+=Math.sin(angle)*step;

    return result;

  function animate({book,front,back,forward=true,single=false,duration=960,onFinish=()=>{}}){

    const space=make('div','ww-turn-space');
    space.style.perspective=Math.max(single?1900:2500,width*5)+'px';
    // On a tall mobile spread, aim the perspective at the visible portion.
    const perspectiveY=single?clamp(innerHeight*.5-rect.top,0,height):height/2;
    space.style.perspectiveOrigin=`50% ${perspectiveY}px`;
    frame.append(space);
    const frontTemplate=cleanClone(front),backTemplate=back?cleanClone(back):null;
    const clones=[],strips=[],animations=[];

      const backFace=make('div','ww-paper-face ww-paper-back');
      // Forward strips run spine→right; backward strips run spine→left.

      const backX=forward?width-(i+1)*step:i*step;
      const addPage=(face,template,source,offset)=>{
        const view=make('div','ww-paper-viewport');view.style.width=width+'px';view.style.left=-offset+'px';
        const copy=template.cloneNode(true);view.append(copy);face.append(view);clones.push([source,copy]);
      };
      addPage(frontFace,frontTemplate,front,sourceX);
      if(backTemplate)addPage(backFace,backTemplate,back,backX);
      else {const blank=make('div','ww-paper-back-blank');blank.style.width=width+'px';blank.style.left=-backX+'px';backFace.append(blank);}
      const fs=make('div','ww-paper-shade'),bs=make('div','ww-paper-shade');
      const fg=make('div','ww-paper-glint'),bg=make('div','ww-paper-glint');
      frontFace.append(fs,fg);backFace.append(bs,bg);strip.append(frontFace,backFace);space.append(strip);
      strips.push({strip,fs,bs,fg,bg});
    }

    // entire turn. In particular, there is NO new ease at the 90° crossing.

function constraintsScene(){const p=profile(),d=data(),trust=d.scope==='mandate';return `<div class="scope-toggle"><button type="button" data-scope="account" aria-pressed="${!trust}">Personal account</button><button type="button" data-scope="mandate" aria-pressed="${trust}">Trust / mandate</button></div><div class="check-stack">${[['authority','Who can decide?',trust?'A beneficiary is not a trustee.':'Establish the relevant account owners.',trust?'Authority unresolved':'Evidence needed'],['risk','What risk is appropriate?','Accepted evidence and purpose-specific limits.','Not assessed'],['permission','What changes are permitted?','Only the household’s explicit permissions.','Review needed']].map(([ic,h,b,s])=>`<div class="check-row"><span class="check-icon">${icon(ic)}</span><div><h3>${h}</h3><p>${b}</p></div><span class="check-status">${s}</span></div>`).join('')}</div><div class="preference-select"><label class="label-xs" for="preference-select">Islamic preference</label><select id="preference-select" data-input="preference">${[['UNCONFIRMED','Not recorded'],['NONE','None stated'],['PREFERRED','Preferred'],['REQUIRED','Required']].map(([v,l])=>`<option value="${v}" ${d.preference===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="scope-warning">${icon('lock')}<span>${trust?'Mandate evidence comes before a decision.':'No investment selection is authorised here.'}</span></div><button class="minor-button" data-dialog="constraints" type="button">Inspect the household’s checks ↗</button>`;}
function exploreScene(){const p=profile(),d=data(),t=timingResult(),o=p.options[d.option],c=copy();return `<div class="timing-panel"><div class="timing-meta"><span>${t.late?'Arrival after first need':'Arrival before first need'}</span><button class="minor-button" type="button" data-dialog="timing">Dates ↗</button></div><div class="timeline-viz ${t.late?'late':'early'}"><div class="track"></div><div class="gap"></div><div class="time-marker need"><span class="time-label">${esc(date(t.need))}<small>${esc(c.need)}</small></span></div><div class="time-marker arrival"><span class="time-label">${esc(date(t.arrival))}<small>${esc(c.resource)}</small></span></div></div><div class="timing-buttons"><button type="button" data-timing="early" aria-pressed="${d.timing==='early'}">Earlier arrival</button><button type="button" data-timing="late" aria-pressed="${d.timing==='late'}">Later arrival</button></div></div><div class="label-xs">Three conversations to explore</div><div class="option-tabs">${c.options.map((x,i)=>`<button type="button" data-option="${i}" aria-pressed="${d.option===i}">${esc(x)}</button>`).join('')}</div><div class="option-focus"><p>${esc(o.keep)}</p><button type="button" class="minor-button" data-dialog="option">What changes? ↗</button></div><div class="option-toolbar"><span class="sub" style="font-size:10px;max-width:170px">Timing only.<br>Not a funding result.</span>${btn('Add to review <span>→</span>','add-option','scene-cta')}</div>`;}

function renderNav(){const r=regional(),p=profile();$('main').setAttribute('data-chapter',S.chapter);$('main').style.setProperty('--accent',TONES[S.chapter][0]);$('main').style.setProperty('--accent-dark',TONES[S.chapter][1]);$('edition').textContent=S.region+' EDITION';$('context-name').textContent=p.family;$('previous').disabled=S.chapter===0||S.turning;$('next').disabled=S.turning;$('next-label').textContent=S.chapter===0?'Open the playbook':S.chapter===7?'Back to cover':'Turn the page';$('chapters').innerHTML=CHAPTERS.map((x,i)=>`<button type="button" class="chapter-link" data-chapter="${i+1}" ${S.chapter===i+1?'aria-current="step"':''} ${S.turning?'disabled':''}><b>0${i+1}</b><span>${esc(SHORT_CHAPTERS[i])}</span></button>`).join('');$('case-select').innerHTML=r.profileIds.map(id=>`<option value="${id}" ${id===S.profiles[S.region]?'selected':''}>${esc(CONTENT.profiles[id].label)}</option>`).join('');$('case-select').disabled=S.turning;document.querySelectorAll('[data-ww-region]').forEach(el=>{el.checked=el.dataset.wwRegion===S.region;el.disabled=S.turning;});$('reading-button').textContent=S.reading?'Page-turn view':'Read without turns';$('quiet-button').textContent=S.quiet?'Motion: off':'Motion: on';$('quiet-button').setAttribute('aria-pressed',String(S.quiet));document.body.classList.toggle('quiet-motion',S.quiet);document.title='WealthWise — '+r.name+' · '+p.label;document.documentElement.dataset.region=S.region;}

function jump(n){n=Math.max(0,Math.min(7,n));if(S.turning||(n===S.chapter&&!S.reading))return;{const _c=S.chapter;S.chapter=n;syncHash();S.chapter=_c;}const reduced=S.quiet||matchMedia('(prefers-reduced-motion:reduce)').matches;if(S.reading){S.chapter=n;renderNav();$('read-chapter-'+n)?.scrollIntoView({behavior:reduced?'instant':'smooth',block:'start'});return;}const book=$('book'),spread=$('spread'),small=matchMedia('(max-width:680px)').matches;if(reduced||typeof Element.prototype.animate!=='function'){S.chapter=n;render();announceChapter(n);return;}const forward=n>S.chapter,oldRect=book.getBoundingClientRect(),newLeft=leftPage(n),newRight=rightPage(n),oldLeft=spread.children[0],oldRight=spread.children[1];let front,back;function fromHTML(html){const t=document.createElement('template');t.innerHTML=html;return t.content.firstElementChild;}if(small){front=spread;back=null;}else{front=forward?oldRight:oldLeft;back=fromHTML(forward?newLeft:newRight);}S.turning=true;S.turnCount++;book.classList.add('turning');book.setAttribute('aria-busy','true');spread.inert=true;renderNav();let done=false;function complete(reason){if(done)return;done=true;currentTurn=null;S.chapter=n;S.turning=false;spread.inert=false;book.classList.remove('turning');book.removeAttribute('aria-busy');book.style.height='';render();announceChapter(n);if(small&&oldRect.top<0&&oldRect.bottom>0&&reason!=='viewport-change'){const top=book.getBoundingClientRect().top+window.scrollY-12;window.scrollTo({top,behavior:'instant'});}}try{if(small)book.style.height=oldRect.height+'px';currentTurn=window.WW_CurvedFolio.animate({book,front,back,forward,single:small,duration:small?820:940,onFinish:complete});if(small)spread.innerHTML=newLeft+newRight;else if(forward)oldRight.replaceWith(fromHTML(newRight));else oldLeft.replaceWith(fromHTML(newLeft));}catch(error){console.error('Page turn recovered:',error);window.WW_CurvedFolio.cancelAll();complete('error-recovery');}}

if(key==='life'){openDialog('The next turn in life.',`<p>A changed circumstance prompts a review. It does not silently rewrite the plan.</p>${p.events.map((x,i)=>`<button type="button" class="contents-row" data-dialog-life="${i}"><b>0${i+1}</b><span>${esc(x[0])}</span><span>↗</span></button>`).join('')}`);return;}
if(key==='audiences'){openDialog(S.region==='US'?'For US advisory teams.':'For UAE wealth teams.',`${r.audiences.map(a=>`<h3>${esc(a[0])}</h3><p>${esc(a[1])}</p>`).join('')}<h3>Choose a household</h3>${r.profileIds.map(id=>`<button type="button" class="contents-row" data-dialog-case="${id}"><span>${esc(CONTENT.profiles[id].label)}</span><span>↗</span></button>`).join('')}`);return;}
if(key==='walkthrough'){openDialog('Plan your walkthrough.',`<p>${esc(p.cta)}.</p><div class="detail-notice">We will reply to arrange a walkthrough using a fictional household. Do not enter client or sensitive information.</div><form id="walkthrough-form"><div class="field"><label for="walk-name">Your name</label><input id="walk-name" type="text" autocomplete="name" placeholder="Name"></div><div class="field"><label for="walk-email">Work email</label><input id="walk-email" type="email" autocomplete="email" placeholder="you@firm.com"></div><div class="field"><label for="walk-firm">Firm</label><input id="walk-firm" type="text" autocomplete="organization" placeholder="Firm name"></div><div class="field"><label for="firm-type">Your team</label><select id="firm-type">${r.audiences.map(a=>`<option>${esc(a[0])}</option>`).join('')}</select></div><div class="field"><label for="walk-focus">Focus</label><select id="walk-focus">${CHAPTERS.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label for="walk-note">A non-confidential discussion point</label><textarea id="walk-note" placeholder="What would you like to explore?" maxlength="600"></textarea></div>${btn('Request a walkthrough ↗','send-walk','drawer-action')}<button type="button" class="textbtn" data-action="export-walk">Save a copy of this brief</button><div class="detail-notice" style="margin-top:10px">Requesting opens a pre-filled email to demo@wealthwise.ae in your mail app. Nothing is sent until you press send there.</div></form>`);return;}
if(key==='evidence'){openDialog('What you are seeing.',`<h3>Interactive examples</h3><p>Six fictional households. Source content retained from the supplied v4 playbook. This redesigned interface demonstrates planning conversations, not the production WealthWise app.</p>${detailPair('The large numbers','Counts of the displayed people, goals, resource records or follow-ups; original fictional amounts in their native currency; and a calendar-month comparison. No savings claim or success probability is fabricated.')}${detailPair('Current, restricted, expected','These are the supplied example resource categories. Current does not mean available or eligible; expected does not mean guaranteed. No combined net worth or funding total is asserted.')}${detailPair('Capability and evidence','No capability is labelled production-certified by this website. The existing release evidence remains the authority. A demo interaction is not a runtime or browser acceptance witness for the app.')}<div class="detail-notice">${esc(r.publicationBoundary)}</div><h3>Source context retained from v4</h3><p>The links below are inherited context—not reverified as part of this visual redesign.</p>${CONTENT.sources.filter(x=>r.sourceIds.includes(x.id)).map(x=>`<p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)} ↗</a><br><small>${esc(x.note)}</small></p>`).join('')}<h3>Prototype boundaries</h3><p>No account connections, backend calls, stored client data, legal or tax services, live enquiries, trades, portfolio changes or plan commitment. Website state stays in this browser tab and resets on reload.</p>`);return;}}
function resourceDialog(id){const a=profile().resources.find(x=>x.id===id);if(!a)return;openDialog(a.name,`${detailPair('Recorded example value',money(a.value,a.currency))}${detailPair('Owner / economic scope',a.owner)}${detailPair('Access',a.access)}${detailPair('Important distinction',a.note)}${detailPair('Source / participation',a.source)}${id==='benefit'?detailPair('Evidence route',BENEFITS[data().benefit].copy):''}<div class="detail-notice">A displayed value does not grant use, prove eligibility or create a goal assignment. No total across different currencies or ownership scopes is calculated.</div>`);}
function downloadText(name,text){const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportBrief(){const p=profile(),d=data(),s=d.selection;if(!s)return;const o=p.options[s.option];downloadText('WealthWise_'+S.profiles[S.region]+'_discussion.txt',`WEALTHWISE — ILLUSTRATIVE DISCUSSION BRIEF\nVisual Playbook v5; synthetic data, not advice, consent, a committed plan or completed execution.\n\nEdition: ${regional().name}\nHousehold: ${p.family}\nContext: ${p.place}\nStory: ${p.segment}\n\nDiscussion: ${o.title}\nWhat could change: ${o.change}\nWhat stays protected: ${o.keep}\nNext evidence: ${o.next}\nNext owner: ${o.owner}\n\nExpected resource at selection: ${p.time.resourceLabel}, ${s.arrival}\nFirst commitment: ${p.time.needLabel}, ${p.time.need}\nOnly dates compared; no funding, tax, FX or investment result.\nContext changed since selection: ${d.changed?'YES — re-review required':'No subsequent local change recorded'}\nPreference at selection: ${s.preference}\nEvidence route at selection: ${s.benefit}\n\nOPEN HANDOFFS\n${p.actions.map(a=>a.join(' | ')).join('\n')}\n\n${regional().publicationBoundary}\nGenerated locally: ${new Date().toISOString()}\n`);toast('Example exported. No plan was adopted.');}
function act(a){if(S.turning&&!['close','export'].includes(a))return;const p=profile(),d=data();switch(a){case'next':jump(S.chapter===7?0:S.chapter+1);break;case'previous':jump(S.chapter-1);break;case'home':jump(0);break;case'close':closeDialog();break;case'walkthrough':showDialog('walkthrough');break;case'go-explore':jump(5);break;case'go-wealth':closeDialog();jump(3);break;case'add-option':d.selection={option:d.option,arrival:p.time[d.timing],preference:d.preference,benefit:d.benefit,event:d.event,revision:d.revision};d.changed=false;jump(6);toast('Added to the example review. No financial change.');break;case'export':exportBrief();break;case'reading':S.reading=!S.reading;render();$('book').scrollIntoView({behavior:'instant',block:'start'});break;case'quiet':S.quiet=!S.quiet;renderNav();break;case'send-walk':{const name=$('walk-name').value.trim(),email=$('walk-email').value.trim(),firm=$('walk-firm').value.trim();if(!name||!email){toast('Please add your name and work email.');($('walk-name').value?$('walk-email'):$('walk-name')).focus();break;}const subj=encodeURIComponent(`WealthWise walkthrough — ${firm||name} (${regional().name})`);const body=encodeURIComponent(`Name: ${name}\nEmail: ${email}\nFirm: ${firm||'—'}\nTeam: ${$('firm-type').value}\nEdition: ${regional().name}\nHousehold example: ${p.family}\nStart with: ${$('walk-focus').value}\n\nWhat would make the discussion useful:\n${$('walk-note').value.trim()||'—'}\n\n(Please use a fictional household for the demonstration.)`);location.href=`mailto:demo@wealthwise.ae?subject=${subj}&body=${body}`;toast('Your mail app should open with the request. Press send there to submit.');break;}
case 'export-walk':downloadText('WealthWise_'+S.profiles[S.region]+'_walkthrough.txt',`WEALTHWISE — LOCAL WALKTHROUGH BRIEF\nNo enquiry submitted. No production capability certified.\nEdition: ${regional().name}\nHousehold example: ${p.family}\nTeam: ${$('firm-type').value}\nFocus: ${$('walk-focus').value}\nDiscussion: ${$('walk-note').value||'Not supplied'}\n`);toast('Brief exported locally. No enquiry submitted.');break;}}
function lifeEvent(i){dirty();data().event=i;if(i===1)data().timing='late';jump(i===1?3:1);}
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el||el.disabled)return;if(el.dataset.action){act(el.dataset.action);return;}if(S.turning)return;if(el.dataset.dialog){showDialog(el.dataset.dialog);return;}if(el.dataset.chapter!==undefined){jump(Number(el.dataset.chapter));return;}if(el.dataset.dialogChapter!==undefined){closeDialog();jump(Number(el.dataset.dialogChapter));return;}if(el.dataset.dialogCase){closeDialog();selectProfile(el.dataset.dialogCase,true);return;}if(el.dataset.dialogLife!==undefined){closeDialog();lifeEvent(Number(el.dataset.dialogLife));return;}if(el.dataset.case){selectProfile(el.dataset.case,true);return;}const d=data();if(el.dataset.person!==undefined){d.person=Number(el.dataset.person);updateCanvas(`[data-person="${d.person}"]`);return;}if(el.dataset.goal!==undefined){d.goal=Number(el.dataset.goal);updateCanvas(`[data-goal="${d.goal}"]`);return;}if(el.dataset.event!==undefined){const v=Number(el.dataset.event);if(v!==d.event){dirty();d.event=v;if(v===1)d.timing='late';}updateCanvas(`[data-event="${v}"]`);return;}if(el.dataset.resourceTab){d.resourceTab=el.dataset.resourceTab;updateCanvas(`[data-resource-tab="${d.resourceTab}"]`);return;}if(el.dataset.resource){resourceDialog(el.dataset.resource);return;}if(el.dataset.scope){if(d.scope!==el.dataset.scope){dirty();d.scope=el.dataset.scope;}updateCanvas(`[data-scope="${d.scope}"]`);return;}if(el.dataset.timing){const prev=d.timing;if(prev!==el.dataset.timing){dirty();d.timing=el.dataset.timing;}updateCanvas(`[data-timing="${d.timing}"]`);if(prev!==d.timing&&!S.quiet&&!matchMedia('(prefers-reduced-motion:reduce)').matches){const node=document.querySelector('.time-marker.arrival');node?.animate([{left:prev==='late'?'78%':'12%'},{left:d.timing==='late'?'78%':'12%'}],{duration:480,easing:'cubic-bezier(.2,.7,.2,1)'});}return;}if(el.dataset.option!==undefined){d.option=Number(el.dataset.option);updateCanvas(`[data-option="${d.option}"]`);return;}if(el.dataset.task!==undefined){const a=profile().actions[Number(el.dataset.task)];openDialog(a[0],`${detailPair('Responsible party',a[1])}${detailPair('Next action',a[2])}<div class="detail-notice">An open follow-up in a fictional discussion. No task has been sent to an external person.</div>`);return;}if(el.dataset.life!==undefined){lifeEvent(Number(el.dataset.life));return;}});
document.addEventListener('change',e=>{const el=e.target;if(S.turning)return;if(el.matches('[data-ww-region]')){switchRegion(el.dataset.wwRegion);return;}if(el.id==='case-select'){selectProfile(el.value);$('case-select').focus({preventScroll:true});return;}if(el.dataset.input==='benefit'&&BENEFITS[el.value]){if(data().benefit!==el.value){dirty();data().benefit=el.value;}updateCanvas('#benefit-kind');return;}if(el.dataset.input==='preference'&&['UNCONFIRMED','NONE','PREFERRED','REQUIRED'].includes(el.value)){if(data().preference!==el.value){dirty();data().preference=el.value;}updateCanvas('#preference-select');}});
document.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(!$('overlay').hidden){if(e.key==='Escape'){e.preventDefault();closeDialog();return;}if(e.key==='Tab'){const all=[...$('dialog').querySelectorAll('button:not(:disabled),a[href],input,select,textarea,summary,[tabindex="0"]')].filter(x=>x.getClientRects().length);const first=all[0],last=all.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('dialog'))){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}return;}if(document.activeElement?.matches('input,textarea,select,summary,[role="radio"]')||S.reading)return;if(e.key==='ArrowRight'){e.preventDefault();act('next');}else if(e.key==='ArrowLeft'){e.preventDefault();act('previous');}});
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeDialog();});
const TURN_CONTROL='button,a,input,select,textarea,label,summary,details,video,audio,iframe,[role="button"],[role="link"],[role="slider"],[role="tab"],[role="radio"],[role="checkbox"],[role="switch"],[contenteditable]:not([contenteditable="false"]),[data-no-turn]';
let pointerStart=null,blockClickUntil=0;
function canTurnFrom(target){return target instanceof Element&&!target.closest(TURN_CONTROL)&&!!target.closest('#spread > .page')&&!S.reading&&!S.turning&&$('overlay').hidden;}
$('book').addEventListener('pointerdown',e=>{pointerStart=null;if(e.button!==0||!canTurnFrom(e.target)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.shiftKey)e.preventDefault();const scrollable=e.target.closest('.scene,.page');pointerStart={id:e.pointerId,x:e.clientX,y:e.clientY,sy:window.scrollY,scrollable,scrollTop:scrollable?.scrollTop||0,type:e.pointerType,target:e.target};},{passive:false});
$('book').addEventListener('pointerup',e=>{const p=pointerStart;if(!p||p.id!==e.pointerId)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;if(p.type!=='mouse'&&Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.6&&canTurnFrom(p.target)){blockClickUntil=performance.now()+650;pointerStart=null;act(dx<0?'next':'previous');}},{passive:true});
$('book').addEventListener('pointercancel',()=>{pointerStart=null;blockClickUntil=performance.now()+450;},{passive:true});
$('book').addEventListener('click',e=>{if(performance.now()<blockClickUntil||e.defaultPrevented||e.button!==0||e.detail>1||!canTurnFrom(e.target)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.shiftKey){e.preventDefault();window.getSelection()?.removeAllRanges();pointerStart=null;act('previous');return;}const selection=window.getSelection();if(selection&&!selection.isCollapsed&&selection.toString().trim())return;const p=pointerStart;pointerStart=null;if(p&&(Math.abs(e.clientX-p.x)>9||Math.abs(e.clientY-p.y)>9||Math.abs(window.scrollY-p.sy)>5||Math.abs((p.scrollable?.scrollTop||0)-p.scrollTop)>5))return;e.preventDefault();act('next');});
window.WW_DEMO={state:()=>JSON.parse(JSON.stringify(S)),jump,render,switchRegion,selectProfile,profile,region:regional,timingResult,content:CONTENT,copy:()=>copy(),setQuiet(v){S.quiet=!!v;renderNav();}};fromHash();render();window.addEventListener('popstate',()=>{HASH_LOCK=true;try{const c=S.chapter;fromHash();const n=S.chapter;S.chapter=c;S.turning=false;const r=S.reading;S.reading=true;jump(n);S.reading=r;render();}finally{HASH_LOCK=false;}});
</script></body></html>
